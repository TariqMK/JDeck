# Builds JDeck Desktop and JDeck Server for Windows x64, macOS Apple Silicon and Linux x64
# (6 builds), then creates one GitHub release with all 6 files. Run it by hand from the
# Actions tab, on main only. It never commits or pushes; it only creates the tag and the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Draft (hidden until you publish it) or public"
        type: choice
        options: [draft, public]
        default: draft
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: JDeck
  PYTHON_VERSION: "3.12"

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed so the API also lists draft releases.
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git tag --list
            gh release list --limit 1000 --json tagName --jq '.[].tagName'
          } | bash .github/scripts/next_version.sh "${{ inputs.bump }}" > next.txt
          tag="$(cat next.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $tag"

  build:
    needs: version
    name: build (${{ matrix.edition }}, ${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        edition: [desktop, server]
        target: [windows-x64, macos-arm64, linux-x64]
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-22.04   # Older glibc, so the Linux builds run on more distributions.
          - edition: desktop
            label: Desktop
            entry: jdeck_desktop.py
            exe_name: JDeck
            display_name: JDeck
            bundle_id: io.github.jdeck.desktop
          - edition: server
            label: Server
            entry: jdeck_server.py
            exe_name: JDeck-Server
            display_name: JDeck Server
            bundle_id: io.github.jdeck.server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      EDITION: ${{ matrix.edition }}
      EXE_NAME: ${{ matrix.exe_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the macOS runner is Apple Silicon
        if: runner.os == 'macOS'
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          [ "$arch" = "arm64" ] || { echo "Expected arm64, got $arch"; exit 1; }

      - name: Install Linux system packages (Desktop - GTK and WebKitGTK for the app window)
        if: runner.os == 'Linux' && matrix.edition == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

      - name: Install Linux system packages (Server - a virtual display for the tray self-check)
        if: runner.os == 'Linux' && matrix.edition == 'server'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "requirements-$EDITION.txt" pyinstaller Pillow
          if [ "$RUNNER_OS" = "Linux" ] && [ "$EDITION" = "desktop" ]; then
            python -m pip install "pywebview[gtk]==6.2.1"
          fi

      - name: Check the window libraries load (Desktop)
        if: matrix.edition == 'desktop'
        run: |
          python -c "import webview; print('pywebview OK')"
          case "$RUNNER_OS" in
            Windows) python -c "import clr; print('pythonnet OK')" ;;
            macOS)   python -c "import WebKit, AppKit; print('PyObjC WebKit OK')" ;;
            Linux)   python -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('WebKit2', '4.1'); from gi.repository import Gtk, WebKit2; print('GTK WebKit OK')" ;;
          esac

      - name: Apply the version
        run: |
          printf '"""The app'"'"'s version. Written by the release build."""\n\n__version__ = "%s"\n' "$VERSION" > _version.py
          cat _version.py

      - name: Build
        env:
          ENTRY: ${{ matrix.entry }}
          BUNDLE_ID: ${{ matrix.bundle_id }}
          DISPLAY_NAME: ${{ matrix.display_name }}
        run: |
          sep=":"
          [ "$RUNNER_OS" = "Windows" ] && sep=";"
          mode="--onefile"
          [ "$RUNNER_OS" = "macOS" ] && mode="--onedir"   # macOS ships a .app bundle.
          icon="assets/icon/jdeck.png"                     # Linux files have no icon; the window uses the PNG.
          [ "$RUNNER_OS" = "Windows" ] && icon="assets/icon/jdeck.ico"
          [ "$RUNNER_OS" = "macOS" ] && icon="assets/icon/jdeck.icns"
          extra=()
          if [ "$EDITION" = "server" ]; then
            # pystray picks its tray backend at run time, so name it for the bundle.
            case "$RUNNER_OS" in
              Windows) extra+=(--hidden-import pystray._win32) ;;
              macOS)   extra+=(--hidden-import pystray._darwin) ;;
              Linux)   extra+=(--hidden-import pystray._xorg) ;;
            esac
          fi
          pyinstaller --noconfirm --clean $mode --windowed \
            --name "$EXE_NAME" \
            --icon "$icon" \
            --osx-bundle-identifier "$BUNDLE_ID" \
            --add-data "web${sep}web" \
            --add-data "assets/icon/jdeck.png${sep}assets/icon" \
            "${extra[@]}" \
            "$ENTRY"
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist/$EXE_NAME.app"
            ls "$app/Contents/Resources/"*.icns >/dev/null 2>&1 || { echo "The macOS app has no icon"; exit 1; }
            plist="$app/Contents/Info.plist"
            plutil -replace CFBundleDisplayName -string "$DISPLAY_NAME" "$plist"
            if [ "$EDITION" = "server" ]; then
              plutil -replace LSUIElement -bool true "$plist"   # Menu-bar only: no Dock icon.
            fi
            # Editing Info.plist breaks PyInstaller's ad-hoc signature. Apple Silicon needs a valid one.
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            plutil -p "$plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|LSUIElement"
          fi

      - name: Check the build is complete
        run: |
          case "$RUNNER_OS" in
            Windows) exe="dist/$EXE_NAME.exe" ;;
            macOS)   exe="dist/$EXE_NAME.app/Contents/MacOS/$EXE_NAME" ;;
            Linux)   exe="dist/$EXE_NAME" ;;
          esac
          [ -f "$exe" ] || { echo "No executable at $exe"; ls -R dist; exit 1; }
          run=()
          # The server self-check loads the tray library, which needs a display on Linux.
          [ "$RUNNER_OS" = "Linux" ] && [ "$EDITION" = "server" ] && run=(xvfb-run -a)
          "${run[@]}" "$exe" --self-check > check.txt 2>&1 || { cat check.txt; exit 1; }
          if [ "$RUNNER_OS" != "Windows" ]; then   # A windowed .exe prints nothing to the runner.
            cat check.txt
            grep -q "v$VERSION" check.txt || { echo "Version $VERSION not in the build"; exit 1; }
          fi

      - name: Package
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p out
          name="$APP_NAME-$LABEL-$TAG-${{ matrix.target }}"
          case "$RUNNER_OS" in
            Windows) cp "dist/$EXE_NAME.exe" "out/$name.exe" ;;
            macOS)   ditto -c -k --keepParent "dist/$EXE_NAME.app" "out/$name.zip" ;;
            Linux)   tar -czf "out/$name.tar.gz" -C dist "$EXE_NAME" ;;
          esac
          ls -la out
          [ -n "$(ls -A out)" ] || { echo "No files were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.edition }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: build-*
          merge-multiple: true

      - name: Check all 6 files are here
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la out
          missing=0
          for edition in Desktop Server; do
            for file in "windows-x64.exe" "macos-arm64.zip" "linux-x64.tar.gz"; do
              f="out/$APP_NAME-$edition-$TAG-$file"
              [ -f "$f" ] || { echo "Missing: $f"; missing=1; }
            done
          done
          count="$(ls -1 out | wc -l)"
          [ "$count" -eq 6 ] || { echo "Expected 6 files, found $count"; missing=1; }
          exit $missing

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          ## Which download do I need?

          **JDeck Desktop** (\`$APP_NAME-Desktop-$TAG-...\`): a window on the computer you use. It connects to JDownloader on your network.

          **JDeck Server** (\`$APP_NAME-Server-$TAG-...\`): runs in the tray on the JDownloader computer. Phones and other computers use JDeck in a browser and sign in with a password.

          | | Windows | macOS (Apple Silicon) | Linux |
          |---|---|---|---|
          | Desktop | \`$APP_NAME-Desktop-$TAG-windows-x64.exe\` | \`$APP_NAME-Desktop-$TAG-macos-arm64.zip\` | \`$APP_NAME-Desktop-$TAG-linux-x64.tar.gz\` |
          | Server | \`$APP_NAME-Server-$TAG-windows-x64.exe\` | \`$APP_NAME-Server-$TAG-macos-arm64.zip\` | \`$APP_NAME-Server-$TAG-linux-x64.tar.gz\` |

          The builds are not signed. See the README for the first start on macOS and Windows.

          EOF
          cat notes.md
          draft=""
          [ "${{ inputs.release_type }}" = "draft" ] && draft="--draft"
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JDeck $TAG" \
            --notes-file notes.md \
            --generate-notes \
            $draft
