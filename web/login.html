<!doctype html>
<!-- JDeck Server sign-in page. On the server computer, it also sets the first password. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · JDeck</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/common.css">
<style>
body { min-height: 100vh; display: grid; place-items: center; }
.sign-in { width: min(380px, calc(100% - 32px)); margin: 32px 0; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.brand img { width: 40px; height: 40px; border-radius: 9px; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.card { padding: 20px; }
.card h2 { font-size: 17px; margin: 0 0 6px; }
.lead { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.field-block { margin-bottom: 14px; }
.message { font-size: 13px; color: var(--danger); margin: 0 0 12px; overflow-wrap: anywhere; }
.message:empty { display: none; }
form button.primary { width: 100%; min-height: 40px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="sign-in">
  <div class="brand">
    <img src="/icon.png" alt="">
    <h1 id="title">JDeck Server</h1>
  </div>

  <section class="card" id="view-loading"><p class="lead">Loading…</p></section>

  <form class="card" id="view-login" hidden novalidate>
    <h2>Sign in</h2>
    <p class="lead">Type the JDeck Server password.</p>
    <div class="field-block">
      <label class="field" for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <p class="message" id="login-message" role="alert"></p>
    <button type="submit" class="primary" id="login-submit">Sign in</button>
  </form>

  <form class="card" id="view-setup" hidden novalidate>
    <h2>Set a password</h2>
    <p class="lead">Every device, this one too, signs in with this password.</p>
    <div class="field-block">
      <label class="field" for="setup-password">New password</label>
      <input type="password" id="setup-password" autocomplete="new-password" required>
    </div>
    <div class="field-block">
      <label class="field" for="setup-repeat">Repeat the password</label>
      <input type="password" id="setup-repeat" autocomplete="new-password" required>
    </div>
    <p class="message" id="setup-message" role="alert"></p>
    <button type="submit" class="primary" id="setup-submit">Save and sign in</button>
  </form>

  <section class="card" id="view-wait" hidden>
    <h2>No password yet</h2>
    <p class="lead">Set the password on the JDeck Server computer first. Then reload this page.</p>
    <button type="button" class="primary" onclick="location.reload()">Reload</button>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
// After sign-in, go back to the control page if that is where the user came from.
const NEXT = new URLSearchParams(location.search).get("next") === "/server" ? "/server" : "/";

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-JDeck": "1" },
    body: JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

function show(view) {
  for (const id of ["view-loading", "view-login", "view-setup", "view-wait"]) $(id).hidden = id !== view;
  const first = $(view).querySelector("input");
  if (first) first.focus();
}

async function start() {
  let s;
  try {
    s = await (await fetch("/api/session")).json();
  } catch (_) {
    $("view-loading").querySelector("p").textContent = "JDeck Server is not reachable. Reload the page.";
    return;
  }
  $("title").textContent = s.title || "JDeck Server";
  if (s.signedIn) { location.replace(NEXT); return; }
  show(s.hasPassword ? "view-login" : s.isLocal ? "view-setup" : "view-wait");
}

async function submit(form, button, message, action) {
  if (button.disabled) return;
  button.disabled = true;
  message.textContent = "";
  try {
    await action();
    location.replace(NEXT);
  } catch (e) {
    message.textContent = e.message;
    form.querySelector("input").select();
  } finally {
    button.disabled = false;
  }
}

$("view-login").addEventListener("submit", (e) => {
  e.preventDefault();
  const password = $("login-password").value;
  if (!password) { $("login-message").textContent = "Type the password."; return; }
  submit($("view-login"), $("login-submit"), $("login-message"), () => post("/api/login", { password }));
});

$("view-setup").addEventListener("submit", (e) => {
  e.preventDefault();
  const password = $("setup-password").value;
  if (!password) { $("setup-message").textContent = "Type a password."; return; }
  if (password !== $("setup-repeat").value) { $("setup-message").textContent = "The two passwords are not the same."; return; }
  submit($("view-setup"), $("setup-submit"), $("setup-message"), () => post("/api/setup-password", { password }));
});

start();
</script>
</body>
</html>
